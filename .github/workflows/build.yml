name: Build Nguyen Phu Mod Zalo Dylib
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install LLVM/Clang & iOS SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          git clone --depth 1 https://github.com/phracker/MacOSX-SDKs.git /tmp/sdks || true

      - name: Compile Dylib
        run: |
          clang -shared \
            -fobjc-arc \
            -arch arm64 \
            -target arm64-apple-ios14.0 \
            -isysroot /tmp/sdks/MacOSX11.3.sdk \
            -w \
            NguyenPhuZaloMod.m -o NguyenPhuZaloMod.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NguyenPhuZaloMod-Dylib
          path: NguyenPhuZaloMod.dylib
