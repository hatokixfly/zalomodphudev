name: Build Nguyen Phu Mod Zalo Dylib
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up iOS Cross Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Download iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks

      - name: Compile Dylib
        run: |
          clang -shared \
            -fobjc-arc \
            -target arm64-apple-ios14.0 \
            -isysroot $HOME/sdks/iPhoneOS14.5.sdk \
            -F$HOME/sdks/iPhoneOS14.5.sdk/System/Library/Frameworks \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            -w \
            NguyenPhuZaloMod.m -o NguyenPhuZaloMod.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NguyenPhuZaloMod-Dylib
          path: NguyenPhuZaloMod.dylib
